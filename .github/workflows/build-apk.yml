name: Build NadhifGallery APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        shell: bash
        run: |
          base64 --decode NadhifGallery-project.b64 > /tmp/nadhif-source.zip
          unzip -tq /tmp/nadhif-source.zip
          unzip -oq /tmp/nadhif-source.zip -d .
          test -f app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK and run tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NadhifGallery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
