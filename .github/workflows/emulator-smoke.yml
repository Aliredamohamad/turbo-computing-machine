name: Android device smoke test
on:
  push:
    paths:
      - .github/workflows/emulator-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download published APK
        run: curl -fL --retry 3 -o NadhifGallery.apk https://github.com/Aliredamohamad/turbo-computing-machine/releases/download/v1.0.0/NadhifGallery-v1.0.0.apk
      - name: Enable KVM on GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r NadhifGallery.apk
            adb shell am start -W -n com.nadhif.gallery/.MainActivity
            sleep 8
            adb shell pidof com.nadhif.gallery
            adb logcat -d -s AndroidRuntime:E > runtime-errors.log
            if grep -q "FATAL EXCEPTION" runtime-errors.log; then cat runtime-errors.log; exit 1; fi
